<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>dragonball z</title>
    <style>
        /* simple styling for the Goku image */
        .goku {
            display: block;
            max-width: 320px;
            height: auto;
            margin: 16px auto;
        }
        figure { text-align: center; margin: 0; }
        figcaption { font-size: 0.9rem; color: #333; }
    </style>
</head>
<body>
    <h1>dragonball z</h1>
    <p>dragonball z</p>
    <figure>
        <img src="goku.gif" alt="Goku" class="goku">
        <figcaption>Goku</figcaption>
    </figure>
</body>
</html>
